name: Daily CricClubs series matches

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write           # needed to commit the updated files back to the repo

concurrency:
  group: series-matches     # never run two copies at once (they'd clash on git push)
  cancel-in-progress: false

jobs:
  update-series:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      - name: Check existing data is in the repo
        run: |
          if [ ! -d responses_matches ] || [ -z "$(ls -A responses_matches)" ]; then
            echo "responses_matches/ is missing or empty. Commit your existing files first."
            exit 1
          fi

      - name: Update series matches
        env:
          CRICCLUBS_API_KEY: ${{ secrets.CRICCLUBS_API_KEY }}
          CRICCLUBS_CONSUMER_KEY: ${{ secrets.CRICCLUBS_CONSUMER_KEY }}
        run: python fetch_get_matches_by_series.py --budget 150

      - name: Load matches into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python matches_to_supabase.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A responses_matches
          [ -f series_state.json ] && git add series_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update series matches $(date -u +%F)"
            git push
          fi